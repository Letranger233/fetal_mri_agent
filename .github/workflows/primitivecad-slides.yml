name: Build PrimitiveCAD Overleaf project
on:
  push:
    branches: [primitivecad-overleaf-slides]
    paths:
      - 'presentations/PrimitiveCAD/main.tex'
      - 'presentations/PrimitiveCAD/prepare_figures.py'
      - '.github/workflows/primitivecad-slides.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitivecad-overleaf-slides
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate figures from source paper
        run: |
          pip install pymupdf requests
          python presentations/PrimitiveCAD/prepare_figures.py
      - name: Commit figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/PrimitiveCAD/figures/
          if ! git diff --cached --quiet; then
            git commit -m "Build PrimitiveCAD paper figures"
            git push origin HEAD:primitivecad-overleaf-slides
          fi
